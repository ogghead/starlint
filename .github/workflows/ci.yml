name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  statuses: read

jobs:
  lint:
    name: Fmt / Clippy / Machete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - run: cargo machete

  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  deny:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2

  test:
    name: Test + Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Full history needed for patch coverage diff
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest

      - name: Run doc tests
        run: cargo test --workspace --doc

      - name: Run tests with coverage
        run: cargo llvm-cov nextest --workspace --lcov --output-path lcov.info

      - name: Generate HTML report
        run: cargo llvm-cov report --html --output-dir target/llvm-cov/html

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: target/llvm-cov/html/
          retention-days: 14

      - name: Enforce coverage floor
        run: cargo llvm-cov report --fail-under-lines 90

      - name: Generate Cobertura report
        if: github.event_name == 'pull_request'
        run: cargo llvm-cov report --cobertura --output-path cobertura.xml

      - name: Enforce patch coverage (≥95% on changed lines)
        if: github.event_name == 'pull_request'
        run: |
          pip install diff-cover
          diff-cover cobertura.xml --compare-branch=origin/${{ github.base_ref }} --fail-under=95

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  codecov-gate:
    name: Codecov Status Gate
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'pull_request'
    steps:
      - name: Wait for Codecov checks and enforce
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.pull_request.head.sha;
            const maxAttempts = 30;
            const delayMs = 10_000;

            for (let attempt = 1; attempt <= maxAttempts; attempt++) {
              const { data: statuses } = await github.rest.repos.listCommitStatusesForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: sha,
              });

              // Keep only the most recent status per context.
              const latest = new Map();
              for (const s of statuses) {
                if (s.context.startsWith('codecov/') && !latest.has(s.context)) {
                  latest.set(s.context, s);
                }
              }

              // Need both codecov/project and codecov/patch.
              if (latest.size >= 2) {
                const failed = [...latest.values()].filter(s => s.state !== 'success');
                if (failed.length > 0) {
                  for (const f of failed) {
                    core.error(`${f.context}: ${f.state} — ${f.description}`);
                  }
                  core.setFailed('Codecov coverage checks failed');
                  return;
                }
                core.info('All Codecov checks passed');
                return;
              }

              core.info(`Waiting for Codecov status checks (${attempt}/${maxAttempts})...`);
              await new Promise(r => setTimeout(r, delayMs));
            }

            core.setFailed('Timed out waiting for Codecov status checks');
