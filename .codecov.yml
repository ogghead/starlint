coverage:
  status:
    project:
      default:
        target: auto     # compare against base commit — no regression allowed
        threshold: 0%
    # Patch coverage enforcement handled by diff-cover in CI (≥95% on changed lines).
    # Codecov patch status is disabled to avoid false ❌ in PR comments when
    # coverage is above the target but has any uncovered lines.
    patch: off

comment:
  layout: "reach,diff,flags,files"
  behavior: new
  require_changes: true

ignore:
  - "benches/**"
  - "examples/**"
  - "crates/starlint_cli/src/main.rs"
