coverage:
  status:
    project:
      default:
        target: auto     # compare against base commit — no regression allowed
        threshold: 0%
    patch:
      default:
        target: 95%      # new/changed lines must be ≥95% covered
        threshold: 1%    # allow up to 1% below target before marking ❌

comment:
  layout: "reach,diff,flags,files"
  behavior: new
  require_changes: true

ignore:
  - "benches/**"
  - "examples/**"
  - "crates/starlint_cli/src/main.rs"
